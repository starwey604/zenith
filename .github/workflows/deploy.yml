name: Build and deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - '.node-version'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - '.node-version'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      # Only the two downloadable FCStd assets are needed, not the source PDFs/CAD.
      - name: Fetch frontend LFS downloads
        working-directory: .
        run: git lfs pull --include='frontend/public/downloads/*.FCStd' --exclude=''

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test feed state and interlocks
        run: npm test

      - name: Build and verify output
        run: npm run build && npm run check:dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check browser interactions
        run: npm run test:browser

      - name: Validate Wrangler package without publishing
        run: npm run deploy:check

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: 4.156.0
          command: deploy
