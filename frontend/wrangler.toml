# Workers 静态资源；仅 /api/comments 通过服务绑定转发，不使用 Pages。
name = "zenith"
main = "worker/index.ts"
compatibility_date = "2026-10-23"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/comments", "/api/comments/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[services]]
binding = "COMMENTS_SERVICE"
service = "zenith-comments"

# zenith.silkenkite.ink 由用户在 Worker 的 Custom Domains 中绑定。
# 不在 routes 中管理域名，避免 CI 覆盖控制台配置或要求 DNS 修改权限。
