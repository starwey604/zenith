<text x="875" y="583" font-size="16">PCB 32 × 32</text><text x="875" y="615" font-size="16">孔距 28 × 28</text><text x="875" y="647" font-size="16">4 × Ø2孔</text><text x="875" y="679" font-size="16">镜头 Ø17</text>
