[sdk]
release = "LubanCat_Linux_Generic_Full_SDK_20260903"
manifest = "sdk/manifest.lock.xml"
chip = "rk3576"
board = "LubanCat-3"
build_container = "ubuntu:22.04 (Distrobox: aura-sdk)"
kernel_version = "6.1.99 (LubanCat lbc-develop-6.1-rt36)"
kernel_toolchain = "Clang 15 (clang-15/lld-15/llvm-15, default) ; GCC 10.3.1 (SDK prebuilt, fallback)"
buildroot_version = "2024.02-rkr5 (Rockchip fork)"

# Pinned commits of SDK sub-repos this project patches (see series.tsv).
[projects]
"buildroot" = "4c038732919b526ea263fd2316feac97dc082213"
"device/rockchip" = "1f1392c6e7f43d4654b24d2fcfefed5811e61a7a"
"u-boot" = "ce67cf027de25347c5c790c3087f6e663f4f3d56"

# The kernel is maintained as a personal fork, not as a patch series.
[kernel]
origin = "https://github.com/starwey604/kernel"      # personal fork = source of truth
upstream = "https://github.com/LubanCat/kernel.git"  # vendor, for future merges
branch = "lbc-develop-6.1-rt36"
commit = "79c7f9aadf5d17ec552f48c307802288106a822b"
note = "Consumed by the SDK via the kernel-6.1 symlink. Pin `commit` for reproducible builds. The vendor manifest pins 1bc19c520831b6d0ca7d7afb4639189a2064e9bc on lbc-develop-6.1 (see sdk/manifest.lock.xml, which points kernel-6.1 at this fork)."

# AMP: Linux + Cortex-M0 (bus_mcu) RT-Thread on RK3576.
# rk3576-rtos and rk3576-hal are personal forks (Rockchip's trees are not public);
# they are pulled into the SDK by sdk/local_manifests/01-amp.xml at the pinned commits.
[amp]
combo = "Linux + Cortex-M0 (bus_mcu) RT-Thread"
amp_partition = "8 MiB (0x4000 sectors)"
board_dts = "rk3576-lubancat-3-v2-mcu"
board_defconfig = "LubanCat_rk3576_buildroot_amp_mcu_defconfig"
its = "amp_mcu_rtt.its"
parameter = "parameter-amp.txt"
toolchain = "arm-none-eabi (public Arm GNU toolchain; `apt install gcc-arm-none-eabi` or ARM 10-2020-q4-major)"
rtos_repo = "https://github.com/starwey604/rk3576-rtos"
rtos_commit = "7c397f41751feb29b0b388dfda3d2c2225f1f87c"
hal_repo = "https://github.com/starwey604/rk3576-hal"
hal_commit = "277de3fd4b0e640654ee73bb3308be2ef01e3aad"
manifest = "sdk/local_manifests/01-amp.xml"
