[vars]
ALLOWED_ORIGINS = "https://zenith.silkenkite.ink,http://localhost:5173,http://127.0.0.1:5173,http://192.168.8.3:5173,http://127.0.0.1:5184,http://127.0.0.1:5191"

# INITIAL_ADMIN_PASSWORD is entered by the owner via `npm run admin:password`.
# No password in this file. An uninitialized database stays closed without that secret.
